server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Arquivos da WebAR (pasta frontend montada pelo compose)
    root  /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker: resolve "api" a cada requisição.
    # Assim o Nginx continua de pé mesmo se a API for parada (teste T08).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /api/... -> container da API Flask
    location /api/ {
        set $api_flask http://api:5000;
        proxy_pass $api_flask;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Demais arquivos (html, css, js, .mind) sem cache, para ver alterações na hora
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }
}