# Broker MQTT (Eclipse Mosquitto 2) — configuração didática
# Porta padrão MQTT (TCP)
listener 1883 0.0.0.0

# ATENÇÃO: acesso anônimo liberado APENAS para o protótipo em sala.
# Em produção: allow_anonymous false + password_file + TLS (porta 8883).
allow_anonymous true

# Guarda mensagens "retidas" (retain) entre reinicializações do broker
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
